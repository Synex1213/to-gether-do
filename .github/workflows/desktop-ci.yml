name: Desktop CI (Windows)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Test server and desktop updater
        run: npm test
      - name: Package Windows NSIS without publishing
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged desktop window
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/win-unpacked/伙伴打卡.exe"
          $desktop = Start-Process -FilePath $exe -PassThru
          try {
            $visible = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              $desktop.Refresh()
              if ($desktop.HasExited) { throw "Packaged desktop exited before opening its window." }
              if ($desktop.MainWindowHandle -ne 0) { $visible = $true; break }
            }
            if (-not $visible) { throw "Packaged desktop did not open a native window." }
            Write-Host "Packaged desktop opened a native window successfully."
          } finally {
            if (-not $desktop.HasExited) { Stop-Process -Id $desktop.Id -Force }
          }
      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-test-installer
          path: dist/*.exe
          if-no-files-found: error
