name: Publish Windows desktop release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/desktop-release.yml']
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish or retry (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual rerun loads the fixed workflow from main,
          # but packages the existing tagged source without moving the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve version and prepare an immutable release tag
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:REQUESTED_TAG } elseif ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "v$version" }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$' -or $tag -ne "v$version") {
            throw "Release tag $tag must match package.json version v$version"
          }
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          if ($env:GITHUB_REF_TYPE -eq 'branch' -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
            if ($LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft) {
              'publish=false' >> $env:GITHUB_OUTPUT
              Write-Host "Release $tag is already published; no new installer is needed."
              exit 0
            }
            $tagSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>$null
            if ($LASTEXITCODE -eq 0) {
              if ($tagSha -ne $env:GITHUB_SHA) { throw "Existing $tag points to a different commit; increment the app version instead of moving the tag." }
            } else {
              gh api --method POST "repos/$env:GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$tag" -f "sha=$env:GITHUB_SHA"
              if ($LASTEXITCODE -ne 0) { throw "Could not create $tag at the tested main commit." }
            }
          }
          'publish=true' >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        if: steps.release.outputs.publish == 'true'
        run: npm ci --include=dev --no-audit --no-fund

      - name: Run tests
        if: steps.release.outputs.publish == 'true'
        run: npm test

      - name: Build and upload NSIS installer and latest.yml
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These names are deliberately not WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD.
          # Electron-builder misinterprets empty WIN_CSC_LINK as a filesystem path.
          OPTIONAL_WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          OPTIONAL_WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:OPTIONAL_WIN_CERT)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:OPTIONAL_WIN_CERT_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Code signing requires both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD GitHub secrets.'
          }
          if ($hasCertificate) {
            $env:WIN_CSC_LINK = $env:OPTIONAL_WIN_CERT
            $env:WIN_CSC_KEY_PASSWORD = $env:OPTIONAL_WIN_CERT_PASSWORD
            Write-Host 'Packaging a signed NSIS installer.'
          } else {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host 'No signing certificate configured; packaging an unsigned NSIS installer.'
          }
          npx electron-builder --win nsis --publish always
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder failed with exit code $LASTEXITCODE"
          }

      - name: Publish release only after all assets have uploaded
        if: steps.release.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          $notes = "docs/releases/$version.md"
          if (Test-Path $notes) {
            gh release edit $env:RELEASE_TAG --title "伙伴打卡 $version" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'Updating release notes failed.' }
          }
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing release $env:RELEASE_TAG failed."
          }
