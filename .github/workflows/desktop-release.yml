name: Publish Windows desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish or retry (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual rerun loads the fixed workflow from main,
          # but packages the existing tagged source without moving the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate requested tag matches app version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Expected a version tag like v1.0.0, got: $env:RELEASE_TAG"
          }
          $version = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Git tag $env:RELEASE_TAG does not match package.json version v$version"
          }

      - name: Install dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build and upload NSIS installer and latest.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These names are deliberately not WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD.
          # Electron-builder misinterprets empty WIN_CSC_LINK as a filesystem path.
          OPTIONAL_WIN_CERT: ${{ secrets.WIN_CSC_LINK }}
          OPTIONAL_WIN_CERT_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          $env:CSC_IDENTITY_AUTO_DISCOVERY = 'false'
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:OPTIONAL_WIN_CERT)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:OPTIONAL_WIN_CERT_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw 'Code signing requires both WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD GitHub secrets.'
          }
          if ($hasCertificate) {
            $env:WIN_CSC_LINK = $env:OPTIONAL_WIN_CERT
            $env:WIN_CSC_KEY_PASSWORD = $env:OPTIONAL_WIN_CERT_PASSWORD
            Write-Host 'Packaging a signed NSIS installer.'
          } else {
            Remove-Item Env:WIN_CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:WIN_CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            Write-Host 'No signing certificate configured; packaging an unsigned NSIS installer.'
          }
          npx electron-builder --win nsis --publish always
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder failed with exit code $LASTEXITCODE"
          }

      - name: Publish release only after all assets have uploaded
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release edit $env:RELEASE_TAG --draft=false
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing release $env:RELEASE_TAG failed."
          }
