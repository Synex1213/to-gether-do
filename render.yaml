services:
  - type: web
    name: couple-connect
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: couple-connect-db
          property: connectionString

databases:
  - name: couple-connect-db
    databaseName: couple_connect
    plan: free
